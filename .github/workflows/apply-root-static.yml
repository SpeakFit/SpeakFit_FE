name: Apply apex SpeakFit static migration

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-root-static.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Apply apex speakfit.co.kr static files for SayUpAI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://files.manuscdn.com/user_upload_by_module/session_file/310519663723575982/XIRcLuMhGMkPsnMj.gz" -o /tmp/root_static_payload_no_workflows.tar.gz
          tar -xzf /tmp/root_static_payload_no_workflows.tar.gz -C .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/build-static-site.mjs static-site
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Deploy apex SpeakFit site on SayUpAI domain"
            git push origin HEAD:main
          fi
