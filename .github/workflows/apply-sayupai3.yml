name: Apply SayUpAI final files

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-sayupai3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Apply final SayUpAI files without workflow changes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://files.manuscdn.com/user_upload_by_module/session_file/310519663723575982/AesitFcTJPsZkdqj.gz" -o /tmp/sayupai_final_payload_no_workflows.tar.gz
          tar -xzf /tmp/sayupai_final_payload_no_workflows.tar.gz -C .
          if [ -f .sayupai_delete_manifest ]; then
            while IFS= read -r target; do
              [ -n "$target" ] && rm -f "$target"
            done < .sayupai_delete_manifest
            rm -f .sayupai_delete_manifest
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rebrand site to SayUpAI and update Pages domain"
            git push origin HEAD:main
          fi
